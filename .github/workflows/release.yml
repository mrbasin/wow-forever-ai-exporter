name: Release ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.0.0
        required: true
        type: string
      publish:
        description: Publish after testing (unchecked builds an Actions artifact only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.package.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use a tag such as v1.0.1.' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: source/requirements-dev.txt
      - name: Install test dependencies
        working-directory: source
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
      - name: Run all tests
        working-directory: source
        run: ./Test.ps1
      - name: Package and verify ZIP
        id: package
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./automation/scripts/Package-Release.ps1 -SourceRoot ./source -Tag $env:RELEASE_TAG -OutputDirectory ./artifacts
          $commit = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          Get-Content ./artifacts/*.sha256 >> $env:GITHUB_STEP_SUMMARY
      - name: Save verified package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: artifacts
      - name: Publish and verify public download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: ./scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -ArtifactDirectory ./artifacts
